apiVersion: apps/v1
kind: Deployment
metadata:
  name: dwh-chat
  namespace: dwh-chat
  labels:
    app: dwh-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dwh-chat
  template:
    metadata:
      labels:
        app: dwh-chat
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: apache/superset:dockerize
          command: ["/bin/sh", "-c"]
          args:
            - dockerize -wait tcp://dwh-chat-db-rw:5432 -timeout 120s
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: copy-static-assets
          image: {{ printf "%s/%s:%s" .Values.image.registry .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /static/chainlit /static/public
              cp -r /usr/local/lib/python3.12/site-packages/chainlit/frontend/dist/. /static/chainlit/
              cp -r /app/public/. /static/public/
          volumeMounts:
            - name: static
              mountPath: /static
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: caddy
          image: caddy:2-alpine
          command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          env:
            - name: HOME
              value: /tmp
            - name: XDG_DATA_HOME
              value: /tmp/caddy-data
            - name: XDG_CONFIG_HOME
              value: /tmp/caddy-config
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: static
              mountPath: /static
              readOnly: true
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: caddy-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: dwh-chat
          image: {{ printf "%s/%s:%s" .Values.image.registry .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: Always
          command: ["chainlit"]
          args: ["run", "app.py", "--host", "0.0.0.0", "--port", "18080"]
          env:
            - name: LISTEN_PORT
              value: "18080"
            - name: ENDPOINTS_CONFIG
              value: "/config/endpoints.yaml"
            - name: MCP_URL
              value: {{ .Values.mcpURL | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecretName | quote }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecretName | quote }}
                  key: password
            - name: DB_HOST
              value: "dwh-chat-db-rw"
            - name: DB_NAME
              value: "dwh_chat"
            - name: CHAINLIT_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authSecretName | quote }}
                  key: secret
          ports:
            - name: chainlit
              containerPort: 18080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: chainlit
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: chainlit
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: endpoints-config
              mountPath: /config
              readOnly: true
            {{- range $i, $s := .Values.apiKeySecrets }}
            - name: apikey-{{ $i }}
              mountPath: {{ $s.mountPath | quote }}
              subPath: {{ $s.key | quote }}
              readOnly: true
            {{- end }}
          resources:
{{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: static
          emptyDir: {}
        - name: caddy-tmp
          emptyDir: {}
        - name: caddy-config
          configMap:
            name: dwh-chat-caddy
        - name: endpoints-config
          configMap:
            name: dwh-chat-endpoints
        {{- range $i, $s := .Values.apiKeySecrets }}
        - name: apikey-{{ $i }}
          secret:
            secretName: {{ $s.secretName | quote }}
        {{- end }}
