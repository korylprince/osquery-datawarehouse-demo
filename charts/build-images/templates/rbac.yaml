apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-images
  namespace: build-images
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-images
  namespace: build-images
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-images
  namespace: build-images
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: build-images
subjects:
  - kind: ServiceAccount
    name: build-images
    namespace: build-images
