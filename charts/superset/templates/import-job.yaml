---
# ConfigMap with Superset resource definitions
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "superset.fullname" . }}-import-resources
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: superset
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: import
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "10"
data:
  resources.json: |
{{ .Files.Get "files/resources.json" | indent 4 }}
  import_resources.py: |
{{ .Files.Get "files/import_resources.py" | indent 4 }}
---
# Job to import Superset resources after deployment
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "superset.fullname" . }}-import-resources
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: superset
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: import
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: Hook-Success
    argocd.argoproj.io/sync-wave: "10"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superset
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: import
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 300
      containers:
        - name: import
          image: python:3.12-slim
          command:
            - python3
            - /resources/import_resources.py
          env:
            - name: SUPERSET_URL
              value: "http://{{ include "superset.fullname" . }}:{{ .Values.superset.service.port | default 8088 }}"
            - name: SUPERSET_USER
              value: {{ .Values.superset.init.user | default "admin" | quote }}
            - name: SUPERSET_PASSWORD
              value: admin
            - name: RESOURCES_FILE
              value: /resources/resources.json
          volumeMounts:
            - name: resources
              mountPath: /resources
              readOnly: true
      volumes:
        - name: resources
          configMap:
            name: {{ include "superset.fullname" . }}-import-resources
