apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage-init
  namespace: garage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-init
  namespace: garage
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-init
  namespace: garage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage-init
subjects:
  - kind: ServiceAccount
    name: garage-init
    namespace: garage
---
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-init
  namespace: garage
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: garage-init
    spec:
      serviceAccountName: garage-init
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: python:3.13-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminTokenSecretName }}
                  key: token
            - name: GARAGE_ENDPOINT
              value: {{ .Values.endpoint | quote }}
            - name: CAPACITY_BYTES
              value: {{ .Values.storage.capacityBytes | quote }}
            - name: ZONE
              value: {{ .Values.zone | quote }}
            {{- if .Values.replicationNamespaces }}
            - name: REPLICATION_NAMESPACES
              value: {{ .Values.replicationNamespaces | quote }}
            {{- end }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          command: ["python", "/scripts/garage-init.py"]
          volumeMounts:
            - name: garage-init-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: garage-init-script
          configMap:
            name: garage-init-script
