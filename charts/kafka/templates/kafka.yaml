apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  resources:
{{ toYaml .Values.kafka.resources | nindent 4 }}
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.storage.size | quote }}
        kraftMetadata: shared
{{- with .Values.storage.storageClass }}
        class: {{ . | quote }}
{{- end }}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: kafka
spec:
{{- if .Values.external.authentication.enabled }}
  clientsCa:
    generateCertificateAuthority: false
{{- end }}
  kafka:
    version: {{ .Values.kafka.version | quote }}
    metadataVersion: {{ .Values.kafka.metadataVersion | quote }}
    metricsConfig:
      type: strimziMetricsReporter
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
{{- if .Values.external.enabled }}
      - name: tls
        port: 9093
        type: cluster-ip
        tls: true
{{- if .Values.external.authentication.enabled }}
        authentication:
          type: tls
{{- end }}
        configuration:
          brokerCertChainAndKey:
            secretName: {{ .Values.external.tlsSecretName | quote }}
            certificate: tls.crt
            key: tls.key
          brokers:
            - broker: 0
              advertisedHost: {{ .Values.external.host | quote }}
              advertisedPort: 9093
{{- end }}
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
