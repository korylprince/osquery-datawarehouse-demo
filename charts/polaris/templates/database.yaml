apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: polaris-db
  namespace: polaris
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  storage:
    size: {{ .Values.storage.size | quote }}
    storageClass: {{ .Values.storage.storageClass | quote }}
  bootstrap:
    initdb:
      database: polaris
      owner: polaris
      secret:
        name: {{ .Values.databaseSecretName | quote }}
