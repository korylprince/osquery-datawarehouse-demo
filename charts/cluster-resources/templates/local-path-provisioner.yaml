{{- if .Values.localPathProvisioner.enabled }}
{{- $localPathRevision := ternary .Values.localPathProvisioner.version (printf "v%s" .Values.localPathProvisioner.version) (hasPrefix "v" .Values.localPathProvisioner.version) -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rancher/local-path-provisioner
    path: deploy
    targetRevision: {{ $localPathRevision | quote }}
    kustomize:
      patches:
        - target:
            group: storage.k8s.io
            version: v1
            kind: StorageClass
            name: local-path
          patch: |-
            apiVersion: storage.k8s.io/v1
            kind: StorageClass
            metadata:
              name: local-path
              annotations:
                storageclass.kubernetes.io/is-default-class: {{ ternary "true" "false" .Values.localPathProvisioner.isDefault | quote }}
        - target:
            version: v1
            kind: Namespace
            name: local-path-storage
          patch: |-
            apiVersion: v1
            kind: Namespace
            metadata:
              name: local-path-storage
              labels:
                pod-security.kubernetes.io/enforce: privileged
        - target:
            version: v1
            kind: ConfigMap
            name: local-path-config
            namespace: local-path-storage
          patch: |-
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: local-path-config
              namespace: local-path-storage
            data:
              config.json: |-
                {
                  "nodePathMap": [
                    {
                      "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
                      "paths": [
                        {{ .Values.localPathProvisioner.nodePath | quote }}
                      ]
                    }
                  ]
                }
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
