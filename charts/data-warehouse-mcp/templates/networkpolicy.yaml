apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-warehouse-mcp
  namespace: data-warehouse-mcp
spec:
  podSelector:
    matchLabels:
      app: data-warehouse-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trino
      ports:
        - protocol: TCP
          port: 8080
